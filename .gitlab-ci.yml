stages:
  - deploy

test:
  stage: deploy
  script:
    - rsync -rult --delete-after --exclude=.git/ --exclude=.gitlab-ci.yml --exclude=.env --exclude=static/ --exclude=node_modules/ $CI_PROJECT_DIR/ //var/www/study-in-uzbekistan-frontend
    - cd /var/www/study-in-uzbekistan-frontend
    - export NVM_DIR="$HOME/.nvm" && [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" && nvm install 18 && nvm use 18 && npm install -g yarn && npm install -g pm2
    #- source ~/.nvm/nvm.sh
    - yarn && yarn build && pm2 start  #pm2 restart "Study In Uzbekistan"
  tags:
#    - main
    - studyin-uzbekistan-prod
  only:
    - master
